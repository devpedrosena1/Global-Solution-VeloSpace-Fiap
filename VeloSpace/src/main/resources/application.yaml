spring:
  application:
    name: VeloSpace

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        "[format_sql]": true
    
jwt:
  secret: ${JWT_SECRET}
