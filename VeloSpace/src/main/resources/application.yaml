spring:
  application:
    name: VeloSpace

  datasource:
    url: jdbc:h2:mem:velospace  # ${DB_URL}
    username: sa # ${DB_USERNAME}
    password:  # ${DB_PASSWORD}
    driver-class-name: org.h2.Driver  # oracle.jdbc.OracleDriver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        "[format_sql]": true
    
jwt:
  secret: SECRET  # ${JWT_SECRET}
